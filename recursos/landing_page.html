<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/typescript/AAT1 Final - Daniel Leiva SASS-TS/recursos/scss/style.css">
    <title>Café Expresso</title>
</head>
<body>

    <!--Header/Navbar-->
    <div class="header">
        <ul class="topnav">
            <li><a href="#"><img class="logo" src="imagenes/LogoCafeExpresso.png" alt=""></a></li>
            <li><a class="titulo-marca" href="#">Café Expresso</a></li>
        </ul>
    </div>
    
        <!--Container vacío (mantiene la estructura)-->
        <div class="row">
            <div class="col- col-s-">
        </div>
      
        <!--Contenido Princial-->
        <div class="col-7 col-s-9">
            <div style="text-align: center;">
                <span class="text-shine">Celebra con nosotros nuestro 10º aniversario!</span>
                <h2 class="subtitulo-p">Registrate para obtener un 25% de descuento en tu siguiente compra!</h2>
                <p class="eslogan">"Un poco de felicidad en cada sorbo, porque nosotros solo ofrecemos lo mejor"</p>
            </div>
          <span style="text-align: center;">
            <div>
                <img class="producto-p" src="imagenes/BolaCafeMolido.png" alt="">
            </div>
          </span>
        </div>
      
        <!--Aside/Formulario-->
        <div class="col-4 col-s-12">
          <div class="aside movimiento">
                <form class="formulario gradient-border" id="formulario" action="">
                    <legend class="form-titulo">¡Registrate Ya!</legend>
                    <div>
                        <label for="">Nombre:</label>
                        <br>
                        <input id="nombre" placeholder="Ingrese un nombre">
                    </div>
                    <div>
                        <label for="">Telefono:</label>
                        <br>
                        <input id="telefono" placeholder="Ingrese un telefóno">
                    </div>
                    <div>
                        <label for="">Email:</label>
                        <br>
                        <input id="email" placeholder="Ingrese un correo">
                    </div>
                    <div>
                        <button type="button" id="enviar" class="btn-enviar">Enviar</button>
                    </div>
                </form>
            </div>
            <!--Container para errores-->
            <div>
                <p>
                    <ul id="errores" style="background-color: white;"></ul>
                </p>
            </div>
        </div>
      </div>
      
      <!--Footer-->
      <div class="footer">
        <p>Chiquimula - @CafeExpresso 2022
            <span>
                <i class="bi bi-facebook"></i>
                <i class="bi bi-instagram"></i>
                <i class="bi bi-twitter"></i>
            </span>
        </p>
    </div>
      
<!--Script JS-->
<script src="/typescript/AAT1 Final - Daniel Leiva SASS-TS/recursos/ts/script.js"></script>
</body>
</html>
